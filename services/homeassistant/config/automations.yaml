- id: homekit_tv_remote_keys
  alias: HomeKit TV remote to Google TV
  description: >-
    Makes the D-pad in the iOS Control Centre remote actually do something.
    HomeKit sends every key correctly, but Home Assistant only handles
    play/pause directly (see set_remote_key in homekit/type_media_players.py) -
    every other key is fired onto the event bus and dropped unless something
    listens. That is why play/pause and mute worked while the arrows looked
    dead. A media_player has no concept of a direction, so the keys have to be
    forwarded to the androidtv_remote *remote* entity instead.
  mode: queued
  max: 20
  triggers:
  - trigger: event
    event_type: homekit_tv_remote_key_pressed
    event_data:
      entity_id: media_player.living_room
  actions:
  - variables:
      key_map:
        arrow_up: DPAD_UP
        arrow_down: DPAD_DOWN
        arrow_left: DPAD_LEFT
        arrow_right: DPAD_RIGHT
        select: DPAD_CENTER
        back: BACK
        exit: HOME
        information: INFO
        rewind: MEDIA_REWIND
        fast_forward: MEDIA_FAST_FORWARD
        next_track: MEDIA_NEXT
        previous_track: MEDIA_PREVIOUS
      command: '{{ key_map.get(trigger.event.data.key_name, "") }}'
  - condition: template
    value_template: '{{ command != "" }}'
  - action: remote.send_command
    target:
      entity_id: remote.living_room
    data:
      command: '{{ command }}'
