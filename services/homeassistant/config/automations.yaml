- id: baby_crying
  alias: Baby crying
  description: Notify both phones when either cry detector fires
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: binary_sensor.anya_baby_crying
    to: 'on'
    for: 00:00:08
  - trigger: state
    entity_id: binary_sensor.bedroom_anya_crying_sound
    to: 'on'
    for: 00:00:08
  actions:
  - action: notify.mobile_app_pan
    data:
      title: "\U0001F476 Baby is crying"
      message: Crying detected in the nursery
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
        url: /nursery
  - action: notify.mobile_app_kate_2
    data:
      title: "\U0001F476 Baby is crying"
      message: Crying detected in the nursery
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
        url: /nursery
  - action: notify.send_message
    target:
      entity_id: notify.katriece_s_echo_dot_announce
    data:
      message: The baby is crying
- id: baby_stirring
  alias: Baby stirring
  description: Quiet heads-up that the baby is awake but not crying
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_anya_babbling_sound
    to: 'on'
    for: 00:00:15
  actions:
  - action: notify.mobile_app_pan
    data:
      title: "\U0001F319 Baby is stirring"
      message: Babbling in the nursery — awake but not crying
      data:
        url: /nursery
