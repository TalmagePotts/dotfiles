# Frigate configuration — nursery camera.
#
# Goals for this instance:
#   1. Continuous recording so you can scrub back through the timeline
#   2. Audio detection for crying, which raises an event you can alert on
#   3. Live view in Home Assistant
#
# Object detection is OFF on purpose — see the `detect` block below.

# Required by the Home Assistant integration, which is MQTT-based: Frigate
# publishes events here and HA subscribes. Without it the HA integration loads
# but no entity ever updates, which reads as a broken integration rather than a
# missing broker.
# host.docker.internal resolves to the host gateway (mapped in the compose
# file); the broker runs host-networked alongside Home Assistant.
mqtt:
  enabled: true
  host: 127.0.0.1
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

# Audio calibration logging. Frigate logs a line per classified sound —
#   "nursery heard <label> with a score of <score>"
# — for every label, BEFORE the listen/threshold filters. That is the only way
# to see the score of a cry that failed to trigger, so it is the tool for
# picking thresholds. Watch it through a few real cries, set the thresholds
# just below the scores observed, then comment this out; it is noisy.
#
#   docker compose logs -f | grep heard
#
# NOTE the logger is camera-scoped: `audio.<camera_name>`, NOT
# `frigate.events.audio` (the module path). The module name silently produces
# no output at all.
#
# Floor: the detector discards anything below AUDIO_MIN_CONFIDENCE = 0.5
# (frigate/const.py), so scores under 0.5 never appear here and a threshold
# below 0.5 has no effect.
logger:
  logs:
    audio.nursery: debug

ffmpeg:
  # Intel VA-API hardware decode. Keeps a 24/7 stream off the CPU.
  hwaccel_args: preset-vaapi

# go2rtc pulls ONE connection from the camera and fans it out to recording,
# audio detection and live view. Cheap cameras have a hard limit on simultaneous
# RTSP clients — without this, the third consumer gets refused and the symptom
# looks like a flaky camera rather than a connection limit.
go2rtc:
  # WebRTC ICE candidates. Without these go2rtc advertises no reachable
  # address, so a browser on any other machine cannot establish a peer
  # connection and silently falls back to MSE/HLS. Those transports are
  # one-way, so the microphone button never appears — which looks like
  # missing two-way audio support rather than a networking gap.
  #
  # List every address a client might reach this host on: LAN and tailnet.
  webrtc:
    candidates:
      - 192.168.0.94:8555
      - 100.98.161.113:8555
      - stun:8555

  streams:
    # Main stream: 2880x1616 @ 20fps. Used for recording, where the detail
    # matters and nothing has to survive a browser's network path.
    nursery:
      - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_HOST}:554/h264Preview_01_main"

    # Sub stream: 896x512 @ 10fps. Used for LIVE VIEW only. Pushing the 4.6MP
    # main stream to a browser over WebRTC is what makes live view stutter —
    # the camera is on WiFi and the decode/transport cost is wildly
    # disproportionate for a monitor feed. Recording quality is unaffected.
    nursery_sub:
      - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_HOST}:554/h264Preview_01_sub"
      # Second source contributes ONLY the talkback channel, so switching live
      # view to the sub stream does not cost the microphone.
      - "rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASSWORD}@{FRIGATE_CAM_HOST}:554/h264Preview_01_sub#backchannel=1"
      # The camera emits AAC. HLS and MSE play AAC fine, but WebRTC cannot
      # carry it at all — it only accepts Opus, PCMU or PCMA. Without this
      # transcode WebRTC negotiates video and silently drops audio, which
      # presents as "the stream has no sound" rather than a codec mismatch.
      # Transcoding 16kHz mono audio is negligible CPU.
      - "ffmpeg:nursery_sub#audio=opus"

    # Duplicate of the sub stream, existing ONLY to back a second HomeKit
    # accessory (see go2rtc_homekit.yml). A HomeKit accessory belongs to exactly
    # one Apple Home, so getting the nursery into a second phone's Home requires
    # a second accessory — and go2rtc keys accessories by stream name, so it
    # requires a second stream name to hang it off.
    #
    # Sources from go2rtc's own restream rather than the camera, so this costs
    # zero additional RTSP connections to the Reolink. Pointing it at the camera
    # directly would spend one of its small pool of concurrent clients and start
    # failing the streams that matter.
    nursery_kate:
      - "rtsp://127.0.0.1:8554/nursery_sub"

    # Clean stream for playback on the TV. Two reasons it is not just
    # nursery_sub:
    #
    #   1. nursery_sub carries a `sendonly` PCMU track — the microphone
    #      backchannel. Players that only ever receive can choke on being
    #      offered a track they are expected to send, and the failure mode is a
    #      black screen rather than an error.
    #   2. Selecting tracks inline would mean a URL like
    #      "...?video=h264&audio=aac", and this URL is handed to VLC through an
    #      Android intent. Query strings do not reliably survive that trip —
    #      the same ampersand problem that broke the listen-only link before.
    #
    # A dedicated stream name means the URL is bare: rtsp://host:8554/nursery_tv
    #
    # Sources from the restream, so it costs no extra connection to the camera.
    nursery_tv:
      - "rtsp://127.0.0.1:8554/nursery_sub?video=h264&audio=aac"

    # Audio-only stream. Exists so the listen-only URL needs a single query
    # parameter (?src=nursery_audio) instead of three joined by ampersands —
    # every layer that touches a URL escapes & differently, and a mangled
    # query string 404s in a way that looks like the stream is missing.
    nursery_audio:
      - "ffmpeg:nursery_sub#audio=aac#video="

cameras:
  nursery:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/nursery
          # This preset is what carries the audio track through to the audio
          # detector. Audio detection silently does nothing without it.
          input_args: preset-rtsp-restream
          roles:
            - record
            - audio
            - detect

    # Pan/tilt control. The E1 Pro is a PTZ camera and exposes ONVIF on port
    # 8000. This surfaces movement controls in both the Frigate UI and Home
    # Assistant.
    #
    # NOTE the password here is the RAW value, not the URL-encoded one used in
    # the go2rtc RTSP URL above — this is not a URL, so encoding it would send
    # a literal "%3F" as part of the password and authentication would fail
    # with a confusing "unauthorized".
    onvif:
      host: "{FRIGATE_CAM_HOST}"
      port: 8000
      user: "{FRIGATE_CAM_USER}"
      password: "{FRIGATE_CAM_PASSWORD_RAW}"

    detect:
      # Object detection (person/car/dog) is disabled. You said you don't need
      # it, and running it on CPU 24/7 costs far more than the audio model does.
      # Flip to true if you ever want person alerts; no other change needed.
      enabled: false
      width: 640
      height: 480
      fps: 5

    record:
      enabled: true
      continuous:
        # How far back the timeline scrubs. 1 day at ~1-2 Mbps is roughly
        # 10-20GB — comfortable on this disk. For "just the last hour" use
        # 0.042; for a weekend, 3. Change and `docker compose restart frigate`.
        days: 1
      # Keep clips around a detected event for longer than the rolling buffer,
      # so a cry from last week is still there after the continuous footage
      # has rolled off.
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14

    audio:
      enabled: true
      # Labels come from YAMNet's fixed 521-class list (/audio-labelmap.txt in
      # the container). The model CANNOT be retrained — Frigate 0.17's custom
      # classification is visual only. Accuracy is improved by tuning the
      # thresholds below, not by feeding it examples.
      #
      # `crying` collapses three YAMNet classes — baby cry, whimper, and
      # crying/sobbing — so soft whimpering is already covered.
      # `babbling` is the earlier signal: cooing and gurgling on waking, before
      # any crying starts. It answers "is the baby awake" rather than "is the
      # baby upset".
      listen:
        - crying
        - babbling
      filters:
        crying:
          # Confidence needed to fire. Lower catches more but false-alarms on
          # similar sounds; higher is quieter but may miss a soft cry.
          # These are starting points — calibrate against real recordings using
          # the debug logger below, don't guess.
          threshold: 0.6
        babbling:
          # Higher than crying on purpose: babbling sits acoustically close to
          # adult speech, so a low threshold here fires every time someone
          # talks near the camera.
          threshold: 0.7
      # RMS gate: below this, the audio model does not run at all.
      #
      # Frigate's default is 500, which is WRONG for this camera by two orders
      # of magnitude — the Reolink mic reports RMS of roughly 0.5-5 in a quiet
      # room (check live values at /api/stats -> cameras.nursery.audio_rms).
      # Left at 500 the model never runs and cry detection silently never
      # fires, while every dashboard still looks healthy. Measure this on any
      # new camera rather than trusting the default.
      #
      # Set BELOW the silent baseline so the model always runs and nothing is
      # missed, letting the confidence thresholds do the filtering. Verified on
      # this camera: at 1 the model runs roughly every 9s and correctly reports
      # `silence` in an empty room — negligible CPU for one camera, and no risk
      # of a quiet cry falling under the gate.
      min_volume: 1

# Frigate needs at least one detector defined even when object detection is off.
detectors:
  cpu1:
    type: cpu

version: 0.17-0
