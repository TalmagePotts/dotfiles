# Mosquitto — broker for Frigate <-> Home Assistant.
#
# Only reason this exists: the Frigate HA integration is MQTT-based. Frigate
# publishes events and HA subscribes; without a shared broker the integration
# loads but no entities ever update.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Authenticated only. The broker listens on the LAN interface (host networking),
# so anonymous access would let anything on the network read camera events and
# publish forged ones.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
